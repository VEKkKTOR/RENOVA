<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENOVA - Plataforma Ciudadana</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.25s ease-out forwards;
      }
    </style>
</head>
<body class="bg-emerald-50/40 text-slate-800 font-sans selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // ── BANCO DE PREGUNTAS DINÁMICAS (BOT) ──
      const QUESTION_POOL = [
        { id: 1, question: "¿Dónde se debe depositar una botella de agua PET limpia?", options: ["Orgánico", "Plástico", "Vidrio"], correct: 1 },
        { id: 2, question: "¿Qué material NO debe mezclarse en el contenedor de papel y cartón?", options: ["Cajas de cereal limpias", "Periódicos viejos", "Cajas de cartón con grasa de comida"], correct: 2 },
        { id: 3, question: "¿Cuál es el valor en puntos de una botella de plástico según RENOVA?", options: ["0.5 Puntos", "1.5 Puntos", "3.0 Puntos"], correct: 1 },
        { id: 4, question: "¿Dónde se deben desechar las pilas y medicamentos caducados?", options: ["Contenedor orgánico", "Puntos de entrega especiales / Residuos peligrosos", "Basura general"], correct: 1 },
        { id: 5, question: "¿Qué acción se recomienda hacer con las botellas antes de reciclarlas?", options: ["Lavarlas y aplastarlas", "Pintarlas de negro", "Llenarlas de tierra"], correct: 0 },
        { id: 6, question: "¿Qué tipo de residuo es una cáscara de plátano o restos de verdura?", options: ["Inorgánico reciclable", "Orgánico (Marrón)", "Metal"], correct: 1 }
      ];

      const DIY_IDEAS_DATA = [
        {
          id: 1, title: "Macetas Auto-Regables con Botellas PET", category: "Plástico", difficulty: "Fácil", timeNeeded: "20 min", likes: 142,
          image: "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=800&q=80",
          description: "Aprovecha botellas de plástico vacías para crear un sistema de autorriego ideal para menta y suculentas.",
          materials: ["Botella de plástico de 2L", "Cuerda de algodón", "Tierra", "Tijeras"],
          steps: ["Corta la botella por la mitad.", "Pasa cuerda de algodón por la tapa.", "Coloca la parte superior invertida y añade tierra y planta."]
        },
        {
          id: 2, title: "Compostero Casero en Caja de Frutas", category: "Orgánico", difficulty: "Intermedio", timeNeeded: "45 min", likes: 210,
          image: "https://images.unsplash.com/photo-1591857177580-dc82b9ac4e1e?auto=format&fit=crop&w=800&q=80",
          description: "Transforma desperdicios de cocina en abono rico para tus plantas usando huacales de madera.",
          materials: ["Huacal de madera", "Cartón seco", "Restos vegetales", "Hojas secas"],
          steps: ["Forra el huacal con cartón perforado.", "Añade capas alternas de restos vegetales y hojas secas."]
        },
        {
          id: 3, title: "Organizador de Escritorio de Cartón", category: "Cartón", difficulty: "Fácil", timeNeeded: "30 min", likes: 175,
          image: "https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=800&q=80",
          description: "Crea compartimentos para lápices y papeles utilizando cajas de cereal o envases rígidos.",
          materials: ["Cajas de cereal limpias", "Papel kraft", "Pegamento", "Tijeras"],
          steps: ["Corta las cajas de cereal en diagonal a diferentes alturas.", "Une las cajas con pegamento.", "Decora el exterior."]
        }
      ];

      const CONFERENCES_DATA = [
        {
          id: 1,
          title: "Economía Circular: De Residuo a Recurso en la Ciudad",
          speaker: "Dra. Elena Rostova",
          speakerRole: "Especialista en Gestión Ambiental",
          speakerAvatar: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=200&q=80",
          date: "Jueves 12 de Noviembre",
          time: "06:00 PM - 07:30 PM",
          mode: "Presencial & Streaming",
          description: "Estrategias prácticas para reducir desperdicios a escala familiar y pequeños comercios locales."
        },
        {
          id: 2,
          title: "El Impacto de los Microplásticos en Nuestro Entorno",
          speaker: "Ing. Carlos Mendoza",
          speakerRole: "Fundador de Ecología Activa",
          speakerAvatar: "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=200&q=80",
          date: "Martes 18 de Noviembre",
          time: "05:00 PM - 06:30 PM",
          mode: "Online (Zoom)",
          description: "Análisis del ciclo de vida del plástico y cómo sustituirlo efectivamente en el consumo diario."
        }
      ];

      const INITIAL_LEADERBOARD = [
        { name: "Sofía Martínez", level: "Avanzado", points: 145.0 },
        { name: "Carlos R.", level: "Intermedio", points: 112.5 },
        { name: "Ana Lucía G.", level: "Iniciado", points: 89.0 },
        { name: "Mateo Pérez", level: "Iniciado", points: 64.5 }
      ];

      function App() {
        const [activeTab, setActiveTab] = useState('home');
        const [user, setUser] = useState({ name: 'Ciudadano RENOVA', email: 'usuario@renova.org', points: 45.0 });
        const [notification, setNotification] = useState(null);
        
        // Bot de Preguntas
        const [questionsDoneToday, setQuestionsDoneToday] = useState(0);
        const [currentQIndex, setCurrentQIndex] = useState(0);
        const [questionScore, setQuestionScore] = useState(0);
        const [questionMsg, setQuestionMsg] = useState(null);

        // Calculadora de impacto
        const [calcState, setCalcState] = useState({ plasticKg: 2.5, paperKg: 1.8, glassKg: 1.2, metalKg: 0.8, goal: 50 });
        const [showCalcTable, setShowCalcTable] = useState(false);
        const [uploadMode, setUploadMode] = useState('pesa');
        const [uploadMaterial, setUploadMaterial] = useState('carton');
        const [estimatedResult, setEstimatedResult] = useState(null);

        // DIY Modal
        const [selectedIdea, setSelectedIdea] = useState(null);

        // Conferencias RSVP Modal
        const [selectedConference, setSelectedConference] = useState(null);
        const [rsvpModalOpen, setRsvpModalOpen] = useState(false);

        const showToast = (msg) => {
          setNotification(msg);
          setTimeout(() => setNotification(null), 3500);
        };

        const handleAnswer = (optionIndex) => {
          if (questionsDoneToday >= 4) {
            showToast("⚠️ Ya alcanzaste el límite de 4 preguntas por hoy.");
            return;
          }
          const currentQ = QUESTION_POOL[currentQIndex % QUESTION_POOL.length];
          setQuestionsDoneToday(prev => prev + 1);

          if (optionIndex === currentQ.correct) {
            setQuestionScore(prev => prev + 0.5);
            setQuestionMsg("¡Correcto! +0.5 Puntos 🎉");
          } else {
            setQuestionMsg("Incorrecto. ¡Sigue aprendiendo! ❌");
          }

          setTimeout(() => {
            setQuestionMsg(null);
            setCurrentQIndex(prev => prev + 1);
          }, 1800);
        };

        const handleEstimate = () => {
          const baseGuessKg = (Math.random() * 2 + 0.5).toFixed(2);
          const safeKg = (baseGuessKg * 0.8).toFixed(2); 
          const pointsEarned = Number((safeKg * (uploadMaterial === 'latas' ? 15 : 8)).toFixed(1));
          
          setEstimatedResult({
            material: uploadMaterial === 'latas' ? 'Latas / Metales' : 'Cartón / Papel',
            kg: safeKg,
            pts: pointsEarned
          });
          setQuestionScore(prev => prev + pointsEarned);
          showToast(`Registro procesado con éxito: ${safeKg} kg calculados (+${pointsEarned} Pts).`);
        };

        return (
          <div className="min-h-screen bg-emerald-50/40 text-slate-800 font-sans flex flex-col">
            {notification && (
              <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-emerald-500/30">
                <span>✨</span>
                <span className="text-sm font-medium">{notification}</span>
              </div>
            )}

            <Header activeTab={activeTab} setActiveTab={setActiveTab} user={user} />

            <main className="flex-1">
              {activeTab === 'home' && (
                <HomeSection 
                  setActiveTab={setActiveTab} 
                  questionsDoneToday={questionsDoneToday}
                  currentQIndex={currentQIndex}
                  questionScore={questionScore}
                  questionMsg={questionMsg}
                  handleAnswer={handleAnswer}
                />
              )}
              {activeTab === 'cambio' && (
                <MiCambioSection 
                  user={user}
                  calcState={calcState} 
                  setCalcState={setCalcState} 
                  showCalcTable={showCalcTable} 
                  setShowCalcTable={setShowCalcTable}
                  uploadMode={uploadMode}
                  setUploadMode={setUploadMode}
                  uploadMaterial={uploadMaterial}
                  setUploadMaterial={setUploadMaterial}
                  handleEstimate={handleEstimate}
                  estimatedResult={estimatedResult}
                />
              )}
              {activeTab === 'leaderboard' && (
                <LeaderboardSection user={user} questionScore={questionScore} />
              )}
              {activeTab === 'ideas' && (
                <DIYSection setSelectedIdea={setSelectedIdea} />
              )}
              {activeTab === 'conferencias' && (
                <ConferencesSection 
                  setSelectedConference={setSelectedConference}
                  setRsvpModalOpen={setRsvpModalOpen}
                />
              )}
              {activeTab === 'guia' && <RecyclingGuideSection />}
            </main>

            <Footer />

            {selectedIdea && (
              <DIYDetailModal idea={selectedIdea} onClose={() => setSelectedIdea(null)} showToast={showToast} />
            )}

            {rsvpModalOpen && selectedConference && (
              <RSVPModal conference={selectedConference} onClose={() => setRsvpModalOpen(false)} showToast={showToast} />
            )}
          </div>
        );
      }

      function Header({ activeTab, setActiveTab, user }) {
        return (
          <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-emerald-100 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
              <div onClick={() => setActiveTab('home')} className="flex items-center gap-3 cursor-pointer">
                <div className="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white font-black text-xl shadow-md">
                  R
                </div>
                <span className="font-extrabold text-2xl text-teal-900 tracking-tight">RENOVA</span>
              </div>
              <nav className="hidden md:flex items-center gap-1 lg:gap-2">
                <button onClick={() => setActiveTab('home')} className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition ${activeTab === 'home' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-emerald-50'}`}>🌱 Inicio</button>
                <button onClick={() => setActiveTab('cambio')} className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition ${activeTab === 'cambio' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-emerald-50'}`}>📊 Mi Cambio</button>
                <button onClick={() => setActiveTab('leaderboard')} className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition ${activeTab === 'leaderboard' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-emerald-50'}`}>🏆 Tabla de Puntos</button>
                <button onClick={() => setActiveTab('ideas')} className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition ${activeTab === 'ideas' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-emerald-50'}`}>💡 DIY</button>
                <button onClick={() => setActiveTab('conferencias')} className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition ${activeTab === 'conferencias' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-emerald-50'}`}>📅 Conferencias</button>
                <button onClick={() => setActiveTab('guia')} className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition ${activeTab === 'guia' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-emerald-50'}`}>📖 Guía</button>
              </nav>
              <div className="flex items-center gap-3">
                <div className="bg-emerald-50 border border-emerald-200 px-4 py-2 rounded-2xl flex items-center gap-2">
                  <span className="text-xs font-bold text-emerald-900">👤 {user.name}</span>
                </div>
              </div>
            </div>
          </header>
        );
      }

      function HomeSection({ setActiveTab, questionsDoneToday, currentQIndex, questionScore, questionMsg, handleAnswer }) {
        const activeQ = QUESTION_POOL[currentQIndex % QUESTION_POOL.length];

        return (
          <div className="space-y-16 pb-16">
            <section className="relative overflow-hidden bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-900 text-white pt-16 pb-20 px-4 sm:px-6 lg:px-8">
              <div className="max-w-7xl mx-auto grid lg:grid-cols-12 gap-12 items-center">
                <div className="lg:col-span-7 space-y-6">
                  <span className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/20 border border-emerald-400/30 text-emerald-200 text-xs font-bold uppercase">
                    ✨ Iniciativa Ciudadana Unida
                  </span>
                  <h1 className="text-4xl sm:text-5xl lg:text-6xl font-black tracking-tight leading-tight">
                    Tu huella puede <br />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 via-teal-200 to-amber-200">
                      cambiar el mundo.
                    </span>
                  </h1>
                  <p className="text-emerald-100 text-base sm:text-lg max-w-xl">
                    Recicla, participa y descubre el poder de tus decisiones. Un planeta más sano empieza contigo.
                  </p>
                  <div className="flex flex-wrap gap-4">
                    <button onClick={() => setActiveTab('cambio')} className="bg-emerald-400 hover:bg-emerald-300 text-emerald-950 font-bold px-7 py-3.5 rounded-2xl shadow-lg transition">
                      Calcula tu impacto
                    </button>
                    <button onClick={() => setActiveTab('guia')} className="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-semibold px-6 py-3.5 rounded-2xl transition">
                      Ver Guía de Reciclaje 📖
                    </button>
                  </div>
                </div>

                <div className="lg:col-span-5 bg-emerald-950/60 backdrop-blur-md p-8 rounded-3xl border border-emerald-500/30 shadow-2xl text-center space-y-4">
                  <h3 className="text-emerald-300 font-bold text-sm tracking-wide uppercase">El cambio está en marcha</h3>
                  <div className="relative w-36 h-36 mx-auto flex items-center justify-center rounded-full border-8 border-emerald-500/30 bg-emerald-900/40">
                    <div className="absolute inset-0 rounded-full border-8 border-emerald-400 border-t-transparent"></div>
                    <span className="text-3xl font-black text-white">72%</span>
                  </div>
                  <p className="text-xs text-emerald-200 font-medium">de nuestra meta comunitaria</p>
                  <div className="pt-2 border-t border-emerald-800/60 text-[11px] text-emerald-300">
                    Construyamos hábitos que el planeta sí quiera recordar.
                  </div>
                </div>
              </div>
            </section>

            {/* BOT DE PREGUNTAS DINÁMICAS */}
            <section className="max-w-4xl mx-auto px-4">
              <div className="bg-gradient-to-r from-emerald-900 to-teal-900 text-white rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
                <div className="space-y-2">
                  <span className="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full uppercase border border-emerald-400/30">
                    🤖 Bot de Preguntas ({questionsDoneToday}/4 hoy)
                  </span>
                  <h3 className="text-xl sm:text-2xl font-black">{activeQ.question}</h3>
                  <p className="text-xs text-emerald-100">Gana 0.5 puntos por acierto. ¡Nuevas preguntas rotativas!</p>
                </div>
                
                <div className="bg-white/10 backdrop-blur-md p-5 rounded-2xl border border-white/20 text-center space-y-3 w-full md:w-80">
                  {questionMsg ? (
                    <div className="p-3 bg-white text-slate-900 font-bold rounded-xl text-sm">{questionMsg}</div>
                  ) : (
                    <div className="space-y-2">
                      {activeQ.options.map((opt, idx) => (
                        <button key={idx} onClick={() => handleAnswer(idx)} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-xl transition">
                          {opt}
                        </button>
                      ))}
                    </div>
                  )}
                  <div className="text-[11px] text-emerald-300 font-semibold">Tus Puntos Acumulados: {questionScore} Pts</div>
                </div>
              </div>
            </section>

            {/* SECCIÓN DE REDES SOCIALES Y CONTACTO */}
            <section className="max-w-4xl mx-auto px-4">
              <div className="bg-white rounded-3xl border p-8 shadow-sm text-center space-y-4">
                <h3 className="text-xl font-bold text-slate-900">Conéctate con Nosotros</h3>
                <p className="text-xs text-slate-600">Si tienes dudas contáctanos en Gmail: <span className="font-bold text-emerald-800">renova.ms1a@gmail.com</span></p>
                <div className="flex justify-center gap-4 pt-2">
                  <a 
                    href="https://www.instagram.com/renova_1a?vrfl=MWw1NnphNmFkMjI5ZA==" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    className="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-6 py-2.5 rounded-xl text-xs font-bold shadow hover:opacity-90 transition"
                  >
                    Instagram
                  </a>
                  <a 
                    href="https://www.facebook.com/share/1MNBpDFxWo/" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    className="bg-blue-600 text-white px-6 py-2.5 rounded-xl text-xs font-bold shadow hover:bg-blue-700 transition"
                  >
                    Facebook
                  </a>
                </div>
              </div>
            </section>

            {/* LO QUE NO DEBES HACER */}
            <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
              <div className="text-center max-w-2xl mx-auto">
                <h2 className="text-3xl font-black text-slate-900">Reciclar bien también es saber qué no mezclar.</h2>
                <p className="text-sm text-slate-600 mt-2">Evita errores comunes en el manejo de residuos.</p>
              </div>
              <div className="grid md:grid-cols-3 gap-6">
                <div className="bg-white p-6 rounded-3xl border shadow-sm space-y-2">
                  <h3 className="font-bold text-lg text-emerald-800">✅ Limpio, seco y separado</h3>
                  <p className="text-xs text-slate-600">Evita contaminar papel y cartón con líquidos o grasa. Identifica tus recipientes por material.</p>
                </div>
                <div className="bg-white p-6 rounded-3xl border shadow-sm space-y-2">
                  <h3 className="font-bold text-lg text-rose-800">❌ Los residuos especiales van aparte</h3>
                  <p className="text-xs text-slate-600">Pilas, medicamentos, electrónicos y envases peligrosos necesitan puntos específicos. No los mezcles con reciclables comunes.</p>
                </div>
                <div className="bg-white p-6 rounded-3xl border shadow-sm space-y-2">
                  <h3 className="font-bold text-lg text-teal-800">📍 Confirma la ruta local</h3>
                  <p className="text-xs text-slate-600">Pregunta a tu servicio municipal qué materiales reciben exactamente y cómo entregarlos.</p>
                </div>
              </div>
            </section>
          </div>
        );
      }

      function MiCambioSection({ user, calcState, setCalcState, showCalcTable, setShowCalcTable, uploadMode, setUploadMode, uploadMaterial, setUploadMaterial, handleEstimate, estimatedResult }) {
        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-12">
            <div className="bg-gradient-to-r from-emerald-800 to-teal-800 text-white p-8 rounded-3xl shadow-lg">
              <h1 className="text-3xl sm:text-4xl font-black">Mi Cambio</h1>
              <p className="text-emerald-100 mt-2 text-sm">Calcula tu impacto semanal o sube evidencia fotográfica de tus materiales.</p>
            </div>

            {/* SECCIÓN: SUBIR FOTO DE CARTÓN / LATAS */}
            <div className="bg-white p-8 rounded-3xl border shadow-sm space-y-6">
              <h3 className="text-xl font-bold text-slate-900">📸 Registro de Cartón y Latas por Foto</h3>
              <p className="text-xs text-slate-600">Envía foto con una pesa mostrando el valor, o sube una imagen de tus residuos para registro automático.</p>
              
              <div className="grid sm:grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-bold text-slate-700 block mb-1">Selecciona el Material</label>
                  <select value={uploadMaterial} onChange={e => setUploadMaterial(e.target.value)} className="w-full p-2.5 border rounded-xl text-sm bg-white">
                    <option value="carton">Cartón / Papel (8 pts/kg)</option>
                    <option value="latas">Latas / Metales (15 pts/kg)</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-700 block mb-1">Método de Verificación</label>
                  <div className="flex gap-2">
                    <button onClick={() => setUploadMode('pesa')} className={`flex-1 py-2 rounded-xl text-xs font-bold border ${uploadMode === 'pesa' ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}>⚖️ Con Pesa</button>
                    <button onClick={() => setUploadMode('auto')} className={`flex-1 py-2 rounded-xl text-xs font-bold border ${uploadMode === 'auto' ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}>📷 Automático</button>
                  </div>
                </div>
              </div>

              {uploadMode === 'pesa' ? (
                <div className="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-3">
                  <label className="text-xs font-bold text-emerald-900 block">Sube foto mostrando la báscula / pesa:</label>
                  <input type="file" className="text-xs" />
                  <p className="text-[11px] text-emerald-700">Se registrará el peso exacto verificado con tu báscula.</p>
                </div>
              ) : (
                <div className="p-4 bg-teal-50 rounded-2xl border border-teal-200 space-y-3">
                  <label className="text-xs font-bold text-teal-900 block">Sube foto de tu cartón o latas:</label>
                  <input type="file" className="text-xs" />
                  <p className="text-[10px] text-slate-500 italic">* Esta imagen será analizada mediante análisis conservador para estimar el peso de forma segura.</p>
                  <button onClick={handleEstimate} className="mt-2 bg-teal-700 hover:bg-teal-800 text-white text-xs font-bold px-4 py-2 rounded-xl">
                    Procesar Registro
                  </button>
                </div>
              )}

              {estimatedResult && (
                <div className="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-xs space-y-1">
                  <p className="font-bold text-amber-900">✨ Registro Exitoso:</p>
                  <p className="text-amber-800">Material: <b>{estimatedResult.material}</b> | Peso registrado: <b>{estimatedResult.kg} kg</b> | Puntos acreditados: <b>+{estimatedResult.pts} Pts</b></p>
                </div>
              )}
            </div>

            {/* CALCULADORA DE IMPACTO */}
            <div className="bg-white p-8 rounded-3xl border shadow-sm space-y-6">
              <h3 className="text-xl font-bold text-slate-900">Tu punto de partida semanal</h3>
              <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                  <label className="text-xs font-bold text-slate-600">Envases plásticos (kg/sem)</label>
                  <input type="number" value={calcState.plasticKg} onChange={e => setCalcState({...calcState, plasticKg: Number(e.target.value)})} className="w-full mt-1 p-2.5 border rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-600">Papel y cartón (kg/sem)</label>
                  <input type="number" value={calcState.paperKg} onChange={e => setCalcState({...calcState, paperKg: Number(e.target.value)})} className="w-full mt-1 p-2.5 border rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-600">Vidrio (kg/sem)</label>
                  <input type="number" value={calcState.glassKg} onChange={e => setCalcState({...calcState, glassKg: Number(e.target.value)})} className="w-full mt-1 p-2.5 border rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-600">Metales (kg/sem)</label>
                  <input type="number" value={calcState.metalKg} onChange={e => setCalcState({...calcState, metalKg: Number(e.target.value)})} className="w-full mt-1 p-2.5 border rounded-xl text-sm" />
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-slate-700 block mb-2">Mi meta: separar correctamente el <span className="text-emerald-700 font-black">{calcState.goal}%</span></label>
                <input type="range" min="10" max="100" value={calcState.goal} onChange={e => setCalcState({...calcState, goal: Number(e.target.value)})} className="w-full accent-emerald-600" />
              </div>

              <button onClick={() => setShowCalcTable(true)} className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-6 py-3 rounded-2xl text-sm shadow transition">
                Generar mi tabla
              </button>
            </div>

            {showCalcTable && (
              <div className="bg-white p-8 rounded-3xl border shadow-sm space-y-6">
                <h3 className="text-xl font-bold text-slate-900">Tu Tabla de Impacto Personalizada</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="border-b bg-emerald-50 text-emerald-900">
                        <th className="p-3">Material</th>
                        <th className="p-3">Generado (kg)</th>
                        <th className="p-3">A Reciclar ({calcState.goal}%)</th>
                        <th className="p-3">Puntos Estimados</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      <tr>
                        <td className="p-3 font-medium">Plástico (PET)</td>
                        <td className="p-3">{calcState.plasticKg} kg</td>
                        <td className="p-3 font-bold text-emerald-700">{(calcState.plasticKg * (calcState.goal/100)).toFixed(1)} kg</td>
                        <td className="p-3 font-bold text-amber-700">+{(calcState.plasticKg * (calcState.goal/100) * 1.5).toFixed(1)} Pts</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-medium">Papel y Cartón</td>
                        <td className="p-3">{calcState.paperKg} kg</td>
                        <td className="p-3 font-bold text-emerald-700">{(calcState.paperKg * (calcState.goal/100)).toFixed(1)} kg</td>
                        <td className="p-3 font-bold text-amber-700">+{(calcState.paperKg * (calcState.goal/100) * 8).toFixed(0)} Pts</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-medium">Vidrio</td>
                        <td className="p-3">{calcState.glassKg} kg</td>
                        <td className="p-3 font-bold text-emerald-700">{(calcState.glassKg * (calcState.goal/100)).toFixed(1)} kg</td>
                        <td className="p-3 font-bold text-amber-700">+{(calcState.glassKg * (calcState.goal/100) * 2).toFixed(0)} Pts</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-medium">Metales</td>
                        <td className="p-3">{calcState.metalKg} kg</td>
                        <td className="p-3 font-bold text-emerald-700">{(calcState.metalKg * (calcState.goal/100)).toFixed(1)} kg</td>
                        <td className="p-3 font-bold text-amber-700">+{(calcState.metalKg * (calcState.goal/100) * 15).toFixed(0)} Pts</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>
        );
      }

      function LeaderboardSection({ user, questionScore }) {
        const fullList = [
          ...INITIAL_LEADERBOARD,
          { name: user.name + ' (Tú)', level: 'Iniciado', points: user.points + questionScore }
        ].sort((a, b) => b.points - a.points);

        return (
          <div className="max-w-4xl mx-auto px-4 py-10 space-y-6">
            <div className="text-center space-y-2">
              <h1 className="text-3xl font-black text-slate-900">🏆 Tabla de Clasificación por Puntos</h1>
              <p className="text-sm text-slate-600">Participantes activos en la comunidad RENOVA.</p>
            </div>
            <div className="bg-white rounded-3xl border shadow-sm overflow-hidden p-6">
              <table className="w-full text-left text-sm">
                <thead>
                  <tr className="border-b bg-emerald-50 text-emerald-900">
                    <th className="p-3">Posición</th>
                    <th className="p-3">Nombre</th>
                    <th className="p-3">Nivel</th>
                    <th className="p-3 text-right">Puntos Totales</th>
                  </tr>
                </thead>
                <tbody className="divide-y">
                  {fullList.map((row, idx) => (
                    <tr key={idx} className={idx === 0 ? "bg-amber-50/50 font-bold" : ""}>
                      <td className="p-3">#{idx + 1}</td>
                      <td className="p-3">{row.name}</td>
                      <td className="p-3"><span className="bg-emerald-100 text-emerald-800 text-[11px] px-2 py-1 rounded-md font-bold">{row.level}</span></td>
                      <td className="p-3 text-right font-black text-emerald-700">{row.points.toFixed(1)} Pts</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      function DIYSection({ setSelectedIdea }) {
        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
            <div className="bg-gradient-to-r from-emerald-800 to-teal-800 text-white p-8 rounded-3xl shadow-lg">
              <h1 className="text-3xl sm:text-4xl font-black">Proyectos DIY con Reciclaje</h1>
              <p className="text-emerald-100 mt-2 text-sm">Transforma materiales cotidianos en objetos útiles para tu hogar.</p>
            </div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {DIY_IDEAS_DATA.map(idea => (
                <div key={idea.id} onClick={() => setSelectedIdea(idea)} className="bg-white rounded-2xl border shadow-sm overflow-hidden cursor-pointer hover:shadow-lg transition flex flex-col">
                  <img src={idea.image} alt={idea.title} className="w-full h-48 object-cover" />
                  <div className="p-5 space-y-2 flex-1 flex flex-col justify-between">
                    <div>
                      <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-md">{idea.category}</span>
                      <h3 className="font-bold text-lg mt-2">{idea.title}</h3>
                      <p className="text-xs text-slate-600 mt-1">{idea.description}</p>
                    </div>
                    <div className="pt-3 border-t text-xs font-bold text-emerald-700 flex items-center justify-between">
                      <span>⏱️ {idea.timeNeeded}</span>
                      <span>Ver Paso a Paso →</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function DIYDetailModal({ idea, onClose, showToast }) {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
            <div className="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 space-y-5 relative">
              <button onClick={onClose} className="absolute top-4 right-4 font-bold text-slate-400 hover:text-slate-600">✕</button>
              <img src={idea.image} alt={idea.title} className="w-full h-48 object-cover rounded-2xl" />
              <div>
                <span className="text-xs font-bold text-emerald-700">{idea.category} • {idea.difficulty}</span>
                <h3 className="text-2xl font-black text-slate-900 mt-1">{idea.title}</h3>
                <p className="text-xs text-slate-600 mt-1">{idea.description}</p>
              </div>

              <div className="space-y-2">
                <h4 className="text-xs font-bold text-slate-800 uppercase">Materiales:</h4>
                <ul className="text-xs text-slate-700 space-y-1 list-disc list-inside bg-emerald-50/50 p-3 rounded-xl">
                  {idea.materials.map((m, i) => <li key={i}>{m}</li>)}
                </ul>
              </div>

              <div className="space-y-2">
                <h4 className="text-xs font-bold text-slate-800 uppercase">Paso a Paso:</h4>
                <div className="space-y-2">
                  {idea.steps.map((s, i) => (
                    <div key={i} className="flex gap-3 text-xs bg-slate-50 p-2.5 rounded-xl border">
                      <span className="font-bold text-emerald-700">Paso {i+1}:</span>
                      <span>{s}</span>
                    </div>
                  ))}
                </div>
              </div>

              <button onClick={() => { showToast("¡Proyecto guardado en tus favoritos!"); onClose(); }} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs">
                Guardar en Favoritos
              </button>
            </div>
          </div>
        );
      }

      function ConferencesSection({ setSelectedConference, setRsvpModalOpen }) {
        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">
            <div className="bg-slate-900 text-white p-8 rounded-3xl relative overflow-hidden space-y-3">
              <span className="bg-amber-400 text-slate-950 text-xs font-extrabold px-3 py-1 rounded-full uppercase">
                Educación Ambiental Comunitaria
              </span>
              <h1 className="text-3xl sm:text-4xl font-black">Conferencias & Charlas Educativas</h1>
              <p className="text-slate-300 text-sm max-w-2xl">
                Aprende de biólogos, gestores ambientales y líderes comunitarios. Modalidad presencial y transmisiones en vivo.
              </p>
            </div>

            <div className="grid md:grid-cols-2 gap-6">
              {CONFERENCES_DATA.map(conf => (
                <div key={conf.id} className="bg-white rounded-2xl border shadow-sm hover:shadow-xl transition flex flex-col justify-between overflow-hidden">
                  <div className="p-6 space-y-4">
                    <div className="flex justify-between items-start">
                      <span className="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800">
                        {conf.mode}
                      </span>
                      <span className="text-xs font-bold text-slate-500">{conf.date}</span>
                    </div>

                    <div>
                      <h3 className="font-bold text-slate-900 text-lg leading-snug">{conf.title}</h3>
                      <p className="text-slate-600 text-xs mt-2 leading-relaxed">{conf.description}</p>
                    </div>

                    <div className="flex items-center gap-3 pt-3 border-t border-slate-100">
                      <img src={conf.speakerAvatar} alt={conf.speaker} className="w-10 h-10 rounded-full object-cover border" />
                      <div>
                        <p className="text-xs font-bold text-slate-800">{conf.speaker}</p>
                        <p className="text-[11px] text-slate-500">{conf.speakerRole}</p>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-50 px-6 py-4 border-t border-slate-100 flex items-center justify-between">
                    <span className="text-xs text-slate-500 font-medium">{conf.time}</span>
                    <button
                      onClick={() => {
                        setSelectedConference(conf);
                        setRsvpModalOpen(true);
                      }}
                      className="bg-slate-900 hover:bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-xl transition"
                    >
                      Reservar Cupo
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function RSVPModal({ conference, onClose, showToast }) {
        const [email, setEmail] = useState('');
        const [done, setDone] = useState(false);

        const handleSubmit = (e) => {
          e.preventDefault();
          setDone(true);
          setTimeout(() => {
            showToast(`¡Cupo reservado con éxito! Revisa tu correo ${email}`);
            onClose();
          }, 1800);
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-5 relative">
              <button onClick={onClose} className="absolute top-4 right-4 font-bold text-slate-400 hover:text-slate-600">✕</button>

              {done ? (
                <div className="text-center py-6 space-y-3">
                  <h3 className="text-xl font-bold text-slate-800">¡Lugar Reservado!</h3>
                  <p className="text-xs text-slate-600">Te enviaremos el pase digital y el enlace de acceso.</p>
                </div>
              ) : (
                <>
                  <div>
                    <span className="text-xs font-bold text-emerald-700 uppercase">Reserva de Entrada Gratuita</span>
                    <h3 className="text-xl font-bold text-slate-900 mt-1">{conference.title}</h3>
                    <p className="text-xs text-slate-500 mt-1">Impartido por: {conference.speaker}</p>
                  </div>

                  <form onSubmit={handleSubmit} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Correo para enviar el boleto:</label>
                      <input 
                        type="email" 
                        required 
                        placeholder="tu@correo.com"
                        value={email}
                        onChange={e => setEmail(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>
                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">
                      Confirmar mi Pase Gratuito
                    </button>
                  </form>
                </>
              )}
            </div>
          </div>
        );
      }

      function RecyclingGuideSection() {
        const [activeBin, setActiveBin] = useState('organico');

        const binDetails = {
          organico: {
            color: 'bg-amber-700',
            title: 'Contenedor Orgánico (Marrón / Verde Cobre)',
            accepts: ['Restos de verduras y frutas', 'Cáscaras de huevo', 'Posos de café y té', 'Hojas secas y restos de jardín'],
            rejects: ['Plásticos', 'Aceite comestible usado', 'Pañales o toallitas', 'Huesos grandes en exceso'],
            tip: 'Ideal para compostaje casero. Reduce el 40% de la basura de tu hogar.'
          },
          inorganico: {
            color: 'bg-emerald-600',
            title: 'Envases y Plásticos (Verde / Amarillo)',
            accepts: ['Botellas de PET (agua, refrescos)', 'Envases HDPE (detergentes, champú)', 'Latas de aluminio y conserva', 'Brik / Envases multilaminados'],
            rejects: ['Juguetes de plástico rotos', 'Bolsas muy sucias de grasa', 'Aparatos electrónicos'],
            tip: 'Lava y aplasta tus botellas antes de depositarlas para ahorrar espacio.'
          },
          papel: {
            color: 'bg-blue-600',
            title: 'Papel y Cartón (Azul)',
            accepts: ['Cajas de cartón corrugado', 'Periódicos y revistas', 'Hojas de papel impresas', 'Tubos de papel higiénico'],
            rejects: ['Cajas de pizza con mucha grasa', 'Papel servilleta usado', 'Papel plastificado o térmico'],
            tip: 'Desarma las cajas para que ocupen menos espacio en la estación de recolección.'
          },
          vidrio: {
            color: 'bg-teal-700',
            title: 'Vidrio (Verde Oscuro)',
            accepts: ['Frascos de conservas o mermelada', 'Botellas de vidrio transparente o ámbar'],
            rejects: ['Espejos o cristales rotos', 'Focos o bombillas', 'Vajilla de cerámica o pirex'],
            tip: 'Quita las tapas de metal y recíclalas en el contenedor de latas.'
          }
        };

        const current = binDetails[activeBin];

        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">
            <div className="text-center max-w-2xl mx-auto space-y-2">
              <span className="text-xs font-bold text-emerald-700 uppercase tracking-wider">Aprende a Separar en Casa</span>
              <h1 className="text-3xl font-black text-slate-900">Guía Práctica de Clasificación</h1>
              <p className="text-slate-600 text-sm">
                Haz clic en cada contenedor para aprender qué materiales van en cada lugar y evitar la contaminación cruzada.
              </p>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              {[
                { key: 'organico', name: 'Orgánicos', color: 'bg-amber-800' },
                { key: 'inorganico', name: 'Plásticos & Latas', color: 'bg-emerald-600' },
                { key: 'papel', name: 'Papel & Cartón', color: 'bg-blue-600' },
                { key: 'vidrio', name: 'Vidrio', color: 'bg-teal-700' },
              ].map((bin) => (
                <button
                  key={bin.key}
                  onClick={() => setActiveBin(bin.key)}
                  className={`p-5 rounded-2xl border transition-all text-left flex flex-col justify-between h-28 ${
                    activeBin === bin.key
                      ? `${bin.color} text-white shadow-xl ring-4 ring-emerald-500/20 scale-105`
                      : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-50'
                  }`}
                >
                  <span className="font-extrabold text-sm sm:text-base">{bin.name}</span>
                </button>
              ))}
            </div>

            <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-lg grid md:grid-cols-2 gap-8">
              <div className="space-y-4">
                <div className="flex items-center gap-3">
                  <div className={`w-4 h-8 rounded-full ${current.color}`}></div>
                  <h3 className="text-xl font-bold text-slate-900">{current.title}</h3>
                </div>

                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-emerald-700 uppercase tracking-wider">Sí se recicla aquí:</h4>
                  <ul className="space-y-1.5 text-sm text-slate-700">
                    {current.accepts.map((item, idx) => (
                      <li key={idx} className="flex items-center gap-2 bg-emerald-50/60 p-2 rounded-lg border border-emerald-100">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
                        <span>{item}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              </div>

              <div className="space-y-4 border-t md:border-t-0 md:border-l border-slate-100 md:pl-8 pt-4 md:pt-0">
                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-rose-700 uppercase tracking-wider">NO depositar aquí:</h4>
                  <ul className="space-y-1.5 text-sm text-slate-700">
                    {current.rejects.map((item, idx) => (
                      <li key={idx} className="flex items-center gap-2 bg-rose-50/60 p-2 rounded-lg border border-rose-100">
                        <span className="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                        <span>{item}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-xs text-amber-900 space-y-1">
                  <p className="font-bold text-amber-800">Consejos RENOVA:</p>
                  <p className="leading-relaxed">{current.tip}</p>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function Footer() {
        return (
          <footer className="bg-slate-900 text-white border-t border-slate-800 py-8 text-center text-xs text-slate-400">
            RENOVA • Menos huella. Más futuro. • {new Date().getFullYear()}
          </footer>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
